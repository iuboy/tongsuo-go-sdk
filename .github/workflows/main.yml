# CI for tongsuo-go-sdk
#
# Jobs:
#   lint            — gofmt + mod tidy + golangci-lint (无需 Tongsuo)
#   build-and-test  — 矩阵: OS × link_type, Ubuntu dynamic 额外跑 ASan
#   build-windows   — Windows MSVC 独立构建

name: CI

on: [push, pull_request]

env:
  TONGSUO_REF: "8.5.0-dev"
  GO_VERSION: "1.22"
  TONGSUO_CONFIGURE_OPTS: "enable-ntls"

jobs:
  # ── 静态检查 ──
  lint:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Go fmt
      run: |
        fmt_output=$(gofmt -l .)
        if [ -n "$fmt_output" ]; then
          echo "::error::以下文件需要 gofmt: $fmt_output"
          gofmt -d $fmt_output
          exit 1
        fi

    - name: Go mod tidy check
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

    - uses: golangci/golangci-lint-action@v6
      with:
        version: v1.61.0
        args: --timeout=5m

  # ── 构建 + 测试 (Linux/macOS) ──
  build-and-test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        link: [dynamic, static]
    runs-on: ${{ matrix.os }}
    env:
      STATIC_FLAG: ${{ matrix.link == 'static' && '-tags=static' || '' }}
      NO_SHARED: ${{ matrix.link == 'static' && 'no-shared' || '' }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Tongsuo
      id: cache-tongsuo
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/tongsuo
        key: tongsuo-${{ matrix.link }}-${{ env.TONGSUO_REF }}-${{ matrix.os }}-${{ hashFiles('.github/workflows/main.yml') }}

    - name: Build Tongsuo
      if: steps.cache-tongsuo.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 --branch=${TONGSUO_REF} https://github.com/Tongsuo-Project/Tongsuo.git
        cd Tongsuo
        ./config --prefix="${RUNNER_TEMP}/tongsuo" --libdir="${RUNNER_TEMP}/tongsuo/lib" ${TONGSUO_CONFIGURE_OPTS} ${NO_SHARED}
        make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
        make install

    - name: Build
      run: |
        CGO_CFLAGS="-Wall -I${RUNNER_TEMP}/tongsuo/include -Wno-deprecated-declarations" \
        CGO_LDFLAGS="-L${RUNNER_TEMP}/tongsuo/lib" \
        go build ${STATIC_FLAG} ./...

    - name: Test
      run: |
        export $([ "$(uname)" = "Darwin" ] && echo "DYLD_LIBRARY_PATH" || echo "LD_LIBRARY_PATH")="${RUNNER_TEMP}/tongsuo/lib"
        CGO_CFLAGS="-Wall -I${RUNNER_TEMP}/tongsuo/include -Wno-deprecated-declarations" \
        CGO_LDFLAGS="-L${RUNNER_TEMP}/tongsuo/lib" \
        go test -count=1 -race -timeout 300s ${STATIC_FLAG} ./...

    # Ubuntu dynamic 额外跑 ASan 测试
    - name: Test with ASan
      if: matrix.os == 'ubuntu-latest' && matrix.link == 'dynamic'
      run: |
        CGO_CFLAGS="-fsanitize=address -fno-omit-frame-pointer -I${RUNNER_TEMP}/tongsuo/include -Wno-deprecated-declarations" \
        CGO_LDFLAGS="-fsanitize=address -L${RUNNER_TEMP}/tongsuo/lib" \
        ASAN_OPTIONS="detect_leaks=1:halt_on_error=1" \
        go test -v -count=1 -timeout 600s ./crypto/...

  # ── Windows 构建 + 测试 ──
  build-windows:
    needs: lint
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Tongsuo Windows
      id: cache-tongsuo
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/tongsuo
        key: tongsuo-${{ env.TONGSUO_REF }}-windows-x64-${{ hashFiles('.github/workflows/main.yml') }}

    - name: Clone Tongsuo
      if: steps.cache-tongsuo.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: Tongsuo-Project/Tongsuo
        path: Tongsuo
        ref: ${{ env.TONGSUO_REF }}

    - uses: ilammy/msvc-dev-cmd@v1
    - uses: ilammy/setup-nasm@v1
    - uses: shogo82148/actions-setup-perl@v1

    - name: Build Tongsuo
      if: steps.cache-tongsuo.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        mkdir _build
        cd _build
        perl ..\Configure VC-WIN64A no-makedepend --prefix=%RUNNER_TEMP%\tongsuo enable-ntls
        nmake /S
        nmake install
      working-directory: Tongsuo

    - name: Build
      shell: cmd
      run: |
        set CGO_CFLAGS=-Wall -I%RUNNER_TEMP%\tongsuo\include -Wno-deprecated-declarations
        set CGO_LDFLAGS=-L%RUNNER_TEMP%\tongsuo\lib
        go build ./...

    - name: Add Tongsuo DLLs to PATH
      shell: pwsh
      run: echo "$env:RUNNER_TEMP\tongsuo\bin" | Out-File -Append $env:GITHUB_PATH

    - name: Test
      shell: cmd
      run: |
        set CGO_CFLAGS=-Wall -I%RUNNER_TEMP%\tongsuo\include -Wno-deprecated-declarations
        set CGO_LDFLAGS=-L%RUNNER_TEMP%\tongsuo\lib
        go test -count=1 -timeout 300s ./...
