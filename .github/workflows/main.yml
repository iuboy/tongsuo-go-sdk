# CI for tongsuo-go-sdk
#
# 矩阵覆盖: Ubuntu/macOS/Windows × 动态链接/静态链接
# Go 1.21+ (国密标准库 crypto/sm3, crypto/sm4 + 原生 fuzzing)
# Tongsuo 8.5.0-dev (SM2/SM3/SM4, NTLS, OCSP, EVP SM4 API)

name: CI

on: [push, pull_request]

env:
  TONGSUO_REF: "8.5.0-dev"
  GO_VERSION: "1.21"

jobs:
  golang-lint:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Go fmt Check
      uses: Jerome1337/gofmt-action@v1.0.5
      with:
        gofmt-path: './'
        gofmt-flags: '-l -d'

    - name: Go Mod
      run: go mod tidy

    - name: Clone Tongsuo
      uses: actions/checkout@v4
      with:
        repository: Tongsuo-Project/Tongsuo
        path: Tongsuo
        ref: ${{ env.TONGSUO_REF }}

    - name: Build Tongsuo
      run: |
        cd Tongsuo
        ./config --prefix="${RUNNER_TEMP}/tongsuo" --libdir="${RUNNER_TEMP}/tongsuo/lib" enable-ntls enable-export-sm4
        make -j$(nproc)
        make install

    - name: Go vet
      run: |
        CGO_CFLAGS="-Wall -I${RUNNER_TEMP}/tongsuo/include -Wno-deprecated-declarations" \
        CGO_LDFLAGS="-L${RUNNER_TEMP}/tongsuo/lib" \
        go vet ./...

    - name: Golang lint
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin v1.61.0
        LD_LIBRARY_PATH="${RUNNER_TEMP}/tongsuo/lib" \
        CGO_CFLAGS="-Wall -I${RUNNER_TEMP}/tongsuo/include -Wno-deprecated-declarations" \
        CGO_LDFLAGS="-L${RUNNER_TEMP}/tongsuo/lib" \
        golangci-lint run ./...

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Clone Tongsuo
      uses: actions/checkout@v4
      with:
        repository: Tongsuo-Project/Tongsuo
        path: Tongsuo
        ref: ${{ env.TONGSUO_REF }}

    - name: Build Tongsuo
      run: |
        cd Tongsuo
        ./config --prefix="${RUNNER_TEMP}/tongsuo" --libdir="${RUNNER_TEMP}/tongsuo/lib" enable-ntls enable-export-sm4
        make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
        make install

    - name: Build
      run: |
        CGO_CFLAGS="-Wall -I${RUNNER_TEMP}/tongsuo/include -Wno-deprecated-declarations" \
        CGO_LDFLAGS="-L${RUNNER_TEMP}/tongsuo/lib" \
        go build ./...

    - name: Test on Ubuntu
      run: |
        LD_LIBRARY_PATH="${RUNNER_TEMP}/tongsuo/lib" \
        CGO_CFLAGS="-Wall -I${RUNNER_TEMP}/tongsuo/include -Wno-deprecated-declarations" \
        CGO_LDFLAGS="-L${RUNNER_TEMP}/tongsuo/lib" \
        go test -count=1 -tags=compliance ./...
      if: matrix.os == 'ubuntu-latest'

    - name: Test on macOS
      run: |
        DYLD_LIBRARY_PATH="${RUNNER_TEMP}/tongsuo/lib" \
        CGO_CFLAGS="-Wall -I${RUNNER_TEMP}/tongsuo/include -Wno-deprecated-declarations" \
        CGO_LDFLAGS="-L${RUNNER_TEMP}/tongsuo/lib" \
        go test -count=1 -tags=compliance ./...
      if: matrix.os == 'macos-latest'

  build-static:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Clone Tongsuo
      uses: actions/checkout@v4
      with:
        repository: Tongsuo-Project/Tongsuo
        path: tongsuo
        ref: ${{ env.TONGSUO_REF }}

    - name: Build Tongsuo Static
      run: |
        cd tongsuo
        ./config --prefix="${RUNNER_TEMP}/tongsuo" --libdir="${RUNNER_TEMP}/tongsuo/lib" enable-ntls enable-export-sm4 no-shared
        make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
        make install

    - name: Build
      run: |
        CGO_CFLAGS="-Wall -I${RUNNER_TEMP}/tongsuo/include -Wno-deprecated-declarations" \
        CGO_LDFLAGS="-L${RUNNER_TEMP}/tongsuo/lib" \
        go build ./...

    - name: Test on Ubuntu
      run: |
        LD_LIBRARY_PATH="${RUNNER_TEMP}/tongsuo/lib" \
        CGO_CFLAGS="-Wall -I${RUNNER_TEMP}/tongsuo/include -Wno-deprecated-declarations" \
        CGO_LDFLAGS="-L${RUNNER_TEMP}/tongsuo/lib" \
        go test -count=1 -tags=compliance ./...
      if: matrix.os == 'ubuntu-latest'

    - name: Test on macOS
      run: |
        DYLD_LIBRARY_PATH="${RUNNER_TEMP}/tongsuo/lib" \
        CGO_CFLAGS="-Wall -I${RUNNER_TEMP}/tongsuo/include -Wno-deprecated-declarations" \
        CGO_LDFLAGS="-L${RUNNER_TEMP}/tongsuo/lib" \
        go test -count=1 -tags=compliance ./...
      if: matrix.os == 'macos-latest'

  build-on-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Clone Tongsuo
      uses: actions/checkout@v4
      with:
        repository: Tongsuo-Project/Tongsuo
        path: Tongsuo
        ref: ${{ env.TONGSUO_REF }}

    - uses: ilammy/msvc-dev-cmd@v1
    - uses: ilammy/setup-nasm@v1
    - uses: shogo82148/actions-setup-perl@v1

    - name: Build Tongsuo
      shell: cmd
      run: |
        mkdir _build
        cd _build
        perl ..\Configure VC-WIN64A no-makedepend --prefix=%RUNNER_TEMP%\tongsuo enable-ntls enable-export-sm4
        nmake /S
        nmake install
      working-directory: Tongsuo

    - name: Build
      shell: cmd
      run: |
        set CGO_CFLAGS=-Wall -I%RUNNER_TEMP%\tongsuo\include -Wno-deprecated-declarations
        set CGO_LDFLAGS=-L%RUNNER_TEMP%\tongsuo\lib
        go build ./...

    - name: Set PATH for go test runtime library search
      shell: perl {0}
      run: |
        use Actions::Core;
        add_path("$ENV{RUNNER_TEMP}\\tongsuo\\bin");
        add_path("$ENV{RUNNER_TEMP}\\tongsuo\\lib");

    - name: Test on Windows
      shell: cmd
      run: |
        copy /y %RUNNER_TEMP%\tongsuo\bin\*.dll "C:\Program Files\MySQL\MySQL Server 8.0\bin"
        copy /y %RUNNER_TEMP%\tongsuo\bin\*.dll "C:\Program Files\OpenSSL\bin"
        copy /y %RUNNER_TEMP%\tongsuo\bin\*.dll C:\Windows\system32
        copy /y %RUNNER_TEMP%\tongsuo\bin\*.dll C:\Strawberry\c\bin
        copy /y %RUNNER_TEMP%\tongsuo\bin\*.dll "C:\Program Files\Microsoft Service Fabric\bin\Fabric\Fabric.Code"
        copy /y %RUNNER_TEMP%\tongsuo\bin\*.dll "C:\Program Files\Git\mingw64\bin"
        copy /y %RUNNER_TEMP%\tongsuo\bin\*.dll c:\tools\php
        copy /y %RUNNER_TEMP%\tongsuo\bin\*.dll "C:\Program Files\Amazon\AWSCLIV2"
        set CGO_CFLAGS=-Wall -I%RUNNER_TEMP%\tongsuo\include -Wno-deprecated-declarations
        set CGO_LDFLAGS=-L%RUNNER_TEMP%\tongsuo\lib
        go test -count=1 -tags=compliance ./...

  # ASan CGo 内存安全测试（仅 Linux）
  # AddressSanitizer 检测 C 层内存越界、use-after-free、double-free
  # macOS 上系统库未 ASan 编译，误报多，所以只跑 Linux
  asan-test:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Clone Tongsuo
      uses: actions/checkout@v4
      with:
        repository: Tongsuo-Project/Tongsuo
        path: Tongsuo
        ref: ${{ env.TONGSUO_REF }}

    - name: Build Tongsuo
      run: |
        cd Tongsuo
        ./config --prefix="${RUNNER_TEMP}/tongsuo" --libdir="${RUNNER_TEMP}/tongsuo/lib" enable-ntls enable-export-sm4
        make -j$(nproc)
        make install

    - name: Build with ASan
      run: |
        CGO_CFLAGS="-fsanitize=address -fno-omit-frame-pointer -I${RUNNER_TEMP}/tongsuo/include -Wno-deprecated-declarations" \
        CGO_LDFLAGS="-fsanitize=address -L${RUNNER_TEMP}/tongsuo/lib" \
        go build ./...

    - name: Test with ASan
      run: |
        LD_LIBRARY_PATH="${RUNNER_TEMP}/tongsuo/lib" \
        CGO_CFLAGS="-fsanitize=address -fno-omit-frame-pointer -I${RUNNER_TEMP}/tongsuo/include -Wno-deprecated-declarations" \
        CGO_LDFLAGS="-fsanitize=address -L${RUNNER_TEMP}/tongsuo/lib" \
        ASAN_OPTIONS="detect_leaks=1:halt_on_error=1" \
        go test -v -count=1 -timeout 600s ./crypto/...
      env:
        TONGSUO_DETAILED_ERRORS: "true"
